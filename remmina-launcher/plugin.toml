id = "aalbayaty/remmina-launcher"
name = "Remmina Launcher"
version = "1.1.0"
# Declares the newest API level (32, first shipped in Noctalia 5.2). The code
# only needs 24: the argument-array form of runAsync (direct exec, no shell)
# for both the scan and the launch, which with the `folder` setting type below
# removes shell quoting entirely. API levels are cumulative, so declaring 32
# drops every Noctalia older than 5.2; lower this back to 24 if that matters.
plugin_api = 32
min_noctalia = "5.0.0"
author = "aalbayaty"
license = "MIT"
dependencies = []
tags = ["Launcher", "Network"]
icon = "device-desktop"
description = "Browse and launch Remmina remote-desktop connections from the launcher."

[[launcher_provider]]
id = "remmina"
entry = "provider.luau"
prefix = "remmina"
glyph = "device-desktop"
include_in_global_search = true
debounce_ms = 100

  # Provider-local category filter. Plugin providers can't inject into the
  # Applications launcher's built-in "Internet/Network" tab (that's derived from
  # .desktop Categories=), so we mirror it with a same-label/glyph filter shown
  # while the remmina provider is active. Each result row carries category = "Network".
  [[launcher_provider.category]]
  label = "Network"
  glyph = "network"

# Plugin-level settings (the shell rejects entry-level [[launcher_provider.setting]]
# even though validate-plugins.py accepts it — launcher_provider settings must be
# top-level [[setting]], as in the official translator/kaomoji plugins).
[[setting]]
key = "remminaDir"
type = "folder"
label_key = "settings.remminaDir.label"
description_key = "settings.remminaDir.description"
default = "~/.local/share/remmina"
